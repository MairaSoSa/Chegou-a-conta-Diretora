    <script>
      (function() {
        function normalize(text) {
          return (text || '')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '');
        }

        function findButtonByLabel(labelRegex) {
          var buttons = document.querySelectorAll('button');
          for (var i = 0; i < buttons.length; i += 1) {
            if (labelRegex.test(normalize(buttons[i].textContent))) return buttons[i];
          }
          return null;
        }

        function findCommonAncestor(a, b) {
          var current = a;
          while (current && current !== document.body) {
            if (current.contains(b)) return current;
            current = current.parentElement;
          }
          return null;
        }

        function reorderSchoolBlocks() {
          var ficha = document.getElementById('sec-ficha');
          if (!ficha || !ficha.parentElement || !ficha.parentElement.parentElement) return false;

          var fichaPanelWrap = ficha.parentElement;
          var mainContainer = fichaPanelWrap.parentElement;

          var equipamentosBtn = findButtonByLabel(/equipamentos publicos do municipio/);
          var suporteBtn = findButtonByLabel(/suporte institucional para gestao/);
          if (!equipamentosBtn || !suporteBtn) return false;

          var auxCardsWrap = findCommonAncestor(equipamentosBtn, suporteBtn);
          if (!auxCardsWrap || !auxCardsWrap.parentElement || auxCardsWrap === fichaPanelWrap) return false;

          if (fichaPanelWrap.nextSibling !== auxCardsWrap) {
            mainContainer.insertBefore(auxCardsWrap, fichaPanelWrap.nextSibling);
          }

          return true;
        }

        var reorderScheduled = false;
        function scheduleReorder() {
          if (reorderScheduled) return;
          reorderScheduled = true;
          requestAnimationFrame(function() {
            reorderScheduled = false;
            reorderSchoolBlocks();
          });
        }

        var observer = new MutationObserver(function() {
          scheduleReorder();
        });

        observer.observe(document.body, { childList: true, subtree: true });
        scheduleReorder();

        var _pushState = history.pushState;
        history.pushState = function() {
          var result = _pushState.apply(this, arguments);
          setTimeout(scheduleReorder, 0);
          return result;
        };

        var _replaceState = history.replaceState;
        history.replaceState = function() {
          var result = _replaceState.apply(this, arguments);
          setTimeout(scheduleReorder, 0);
          return result;
        };

        window.addEventListener('popstate', scheduleReorder);
      })();
    </script>
