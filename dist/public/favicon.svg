<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2a6645"/>
      <stop offset="100%" stop-color="#163d28"/>
    </linearGradient>
    <linearGradient id="pagegrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="100%" stop-color="#f5e8cc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle inner glow top-left -->
  <ellipse cx="16" cy="12" rx="24" ry="16" fill="rgba(255,255,255,0.06)"/>

  <!-- ── PAGE / DOCUMENT ── -->
  <!-- Main page body (corner clipped top-right) -->
  <path d="M 11,9 L 41,9 L 53,21 L 53,57 L 11,57 Z"
        fill="url(#pagegrad)"/>

  <!-- Folded corner flap (slightly warm shadow) -->
  <path d="M 41,9 L 53,9 L 53,21 Z"
        fill="#c8a060" opacity="0.85"/>

  <!-- Fold crease line shadow -->
  <path d="M 41,9 L 53,21"
        fill="none" stroke="rgba(100,60,10,0.3)" stroke-width="0.8"/>

  <!-- Left spine / margin line (pauta vermelha) -->
  <line x1="19" y1="9" x2="19" y2="57"
        stroke="rgba(195,55,55,0.45)" stroke-width="1.5"/>

  <!-- Ruling lines (pauta) — 4 lines -->
  <line x1="22" y1="24" x2="50" y2="24"
        stroke="#c8a86a" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="22" y1="32" x2="50" y2="32"
        stroke="#c8a86a" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="22" y1="40" x2="50" y2="40"
        stroke="#c8a86a" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="22" y1="48" x2="46" y2="48"
        stroke="#c8a86a" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>

  <!-- Small green leaf accent — bottom left outside the page -->
  <path d="M 6,54 C 8,49 14,50 13,55 C 12,58 7,57 6,54 Z"
        fill="#3aae6a" opacity="0.9"/>
  <path d="M 6,54 C 10,51 13,53 13,55"
        fill="none" stroke="#1d7a42" stroke-width="0.9"/>
</svg>
